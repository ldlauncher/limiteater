name: Build iOS IPA for TrollStore / Sideloadly

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select active Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          ls -la Limiteater.xcodeproj

      - name: Archive Limiteater App with xcodebuild
        run: |
          cd ios
          xcodebuild archive \
            -project Limiteater.xcodeproj \
            -scheme Limiteater \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "./Limiteater.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Real .IPA from Archive
        run: |
          echo "=== VERIFYING ARCHIVE CONTENTS ==="
          ls -la ios/Limiteater.xcarchive
          ls -la ios/Limiteater.xcarchive/Products/Applications/
          
          APP_PATH="ios/Limiteater.xcarchive/Products/Applications/Limiteater.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Searching for Limiteater.app in archive..."
            APP_PATH=$(find ios/Limiteater.xcarchive -name "Limiteater.app" -type d | head -n 1)
          fi
          
          echo "Using App Path: $APP_PATH"
          ls -lh "$APP_PATH"
          
          echo "=== PACKAGING INTO IPA ==="
          mkdir -p ipa_staging/Payload
          cp -r "$APP_PATH" ipa_staging/Payload/
          
          # Verify Info.plist exists
          if [ ! -f "ipa_staging/Payload/Limiteater.app/Info.plist" ]; then
            echo "Copying fallback Info.plist..."
            cp ios/Limiteater/Info.plist ipa_staging/Payload/Limiteater.app/
          fi
          
          cd ipa_staging
          zip -r -9 ../Limiteater.ipa Payload
          cd ..
          
          echo "=== RESULTING IPA DETAILS ==="
          ls -lh Limiteater.ipa

      - name: Upload Real IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Limiteater-TrollStore-IPA
          path: Limiteater.ipa
          retention-days: 14
