name: Build iOS IPA for TrollStore / Sideloadly

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select active Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          ls -la Limiteater.xcodeproj

      - name: Build Limiteater App with xcodebuild
        run: |
          cd ios
          set -o pipefail
          xcodebuild build \
            -project Limiteater.xcodeproj \
            -scheme Limiteater \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee ../xcodebuild.log || {
              echo "=== EMITTING COMPILER ERRORS ==="
              grep -E "error:" ../xcodebuild.log | while IFS= read -r line; do
                echo "::error::$line"
              done
              tail -n 60 ../xcodebuild.log
              exit 1
            }

      - name: Inspect and Package Real .IPA
        run: |
          echo "=== SEARCHING FOR COMPILED Limiteater.app ==="
          APP_PATH=$(find ios/DerivedData/Build/Products -name "Limiteater.app" -type d | head -n 1)
          echo "Found product app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Limiteater.app was not found in Products!"
            find ios/DerivedData -maxdepth 4
            exit 1
          fi
          
          echo "=== APP BUNDLE CONTENTS ==="
          ls -la "$APP_PATH"
          
          # Stage into Payload
          mkdir -p ipa_staging/Payload
          cp -r "$APP_PATH" ipa_staging/Payload/
          
          cd ipa_staging
          zip -r -9 ../Limiteater.ipa Payload
          cd ..
          
          echo "=== FINAL IPA FILE DETAILS ==="
          ls -lh Limiteater.ipa

      - name: Upload Real IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Limiteater-TrollStore-IPA
          path: Limiteater.ipa
          retention-days: 14
