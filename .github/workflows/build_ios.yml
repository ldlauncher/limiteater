name: Build iOS IPA for TrollStore / Sideloadly

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select active Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          ls -la

      - name: Build Limiteater App with xcodebuild
        run: |
          cd ios
          xcodebuild clean build \
            -project Limiteater.xcodeproj \
            -scheme Limiteater \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            BUILD_DIR="../build_output" \
            SYMROOT="../build_output"

      - name: Package real .IPA (TrollStore / Sideloadly compatible)
        run: |
          echo "Packaging compiled app into .ipa..."
          mkdir -p ipa_package/Payload
          
          # Find the compiled .app bundle
          APP_PATH=$(find build_output -name "Limiteater.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Limiteater.app was not built!"
            exit 1
          fi
          
          cp -r "$APP_PATH" ipa_package/Payload/
          
          # Verify Info.plist exists inside Payload/Limiteater.app
          if [ ! -f "ipa_package/Payload/Limiteater.app/Info.plist" ]; then
            echo "Copying fallback Info.plist..."
            cp ios/Limiteater/Info.plist ipa_package/Payload/Limiteater.app/
          fi
          
          cd ipa_package
          zip -r -9 ../Limiteater.ipa Payload
          cd ..
          
          echo "=== RESULTING IPA DETAILS ==="
          ls -lh Limiteater.ipa

      - name: Upload Real IPA
        uses: actions/upload-artifact@v4
        with:
          name: Limiteater-TrollStore-IPA
          path: Limiteater.ipa
          retention-days: 14
