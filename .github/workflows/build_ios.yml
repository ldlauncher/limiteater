name: Build iOS IPA for TrollStore / Sideloadly

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select active Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          ls -la Limiteater.xcodeproj

      - name: Build Limiteater App with Ad-Hoc Sign
        run: |
          cd ios
          xcodebuild build \
            -project Limiteater.xcodeproj \
            -scheme Limiteater \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Inspect and Package Real .IPA
        run: |
          echo "### Products in DerivedData" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find ios/DerivedData/Build/Products -type f >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Find the real compiled app
          APP_PATH=$(find ios/DerivedData/Build/Products -name "Limiteater.app" -type d | head -n 1)
          echo "Found product app at: $APP_PATH"
          
          echo "### Contents of Limiteater.app" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la "$APP_PATH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Stage into Payload
          mkdir -p ipa_staging/Payload
          cp -r "$APP_PATH" ipa_staging/Payload/
          
          cd ipa_staging
          zip -r -9 ../Limiteater.ipa Payload
          cd ..
          
          echo "### IPA Details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh Limiteater.ipa >> $GITHUB_STEP_SUMMARY
          unzip -l Limiteater.ipa >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Real IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Limiteater-TrollStore-IPA
          path: Limiteater.ipa
          retention-days: 14
