name: Build iOS IPA for TrollStore / Sideloadly

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select active Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          ls -la Limiteater.xcodeproj

      - name: Build Limiteater App with Ad-Hoc Sign
        run: |
          cd ios
          xcodebuild build \
            -project Limiteater.xcodeproj \
            -target Limiteater \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee ../xcodebuild.log
          
          echo "=== XCODEBUILD LOG OUTPUT ==="
          cat ../xcodebuild.log

      - name: Inspect and Package Real .IPA
        run: |
          echo "=== SEARCHING FOR COMPILED Limiteater.app ==="
          APP_PATH=$(find ios/DerivedData -name "Limiteater.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Limiteater.app was not found!"
            find ios/DerivedData -maxdepth 5
            exit 1
          fi
          
          echo "=== APP BUNDLE CONTENTS ==="
          ls -la "$APP_PATH"
          
          if [ ! -f "$APP_PATH/Limiteater" ]; then
            echo "CRITICAL ERROR: Executable binary Limiteater is MISSING in $APP_PATH!"
            echo "Searching for any compiled Limiteater binary:"
            find ios/DerivedData -type f -perm +111 || true
            exit 1
          fi
          
          echo "=== EXECUTABLE BINARY VERIFIED ==="
          ls -lh "$APP_PATH/Limiteater"
          
          echo "=== PACKAGING INTO IPA ==="
          mkdir -p ipa_staging/Payload
          cp -r "$APP_PATH" ipa_staging/Payload/
          
          cd ipa_staging
          zip -r -9 ../Limiteater.ipa Payload
          cd ..
          
          echo "=== FINAL IPA FILE DETAILS ==="
          ls -lh Limiteater.ipa

      - name: Upload Real IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Limiteater-TrollStore-IPA
          path: Limiteater.ipa
          retention-days: 14

      - name: Upload Build Log (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
