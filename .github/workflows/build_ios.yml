name: Build iOS IPA for TrollStore / Sideloadly

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select active Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          ls -la Limiteater.xcodeproj

      - name: Build Limiteater App with xcodebuild
        run: |
          cd ios
          xcodebuild build \
            -project Limiteater.xcodeproj \
            -scheme Limiteater \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./DerivedData \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual

      - name: Inspect and Package Real .IPA
        run: |
          echo "=== CHECKING COMPILED APP DIRECTORY ==="
          APP_DIR=$(find ios/DerivedData/Build/Products/Release-iphoneos -name "Limiteater.app" -type d | head -n 1)
          echo "App directory found at: $APP_DIR"
          
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Limiteater.app was not produced by xcodebuild!"
            exit 1
          fi
          
          echo "=== CONTENTS OF Limiteater.app ==="
          ls -la "$APP_DIR"
          
          echo "=== PACKAGING INTO IPA ==="
          mkdir -p ipa_staging/Payload
          cp -r "$APP_DIR" ipa_staging/Payload/
          
          # Ensure Info.plist is present
          if [ ! -f "ipa_staging/Payload/Limiteater.app/Info.plist" ]; then
            echo "Warning: Info.plist missing, copying from source..."
            cp ios/Limiteater/Info.plist ipa_staging/Payload/Limiteater.app/
          fi
          
          cd ipa_staging
          zip -r -9 ../Limiteater.ipa Payload
          cd ..
          
          echo "=== FINAL IPA FILE DETAILS ==="
          ls -lh Limiteater.ipa

      - name: Upload Real IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Limiteater-TrollStore-IPA
          path: Limiteater.ipa
          retention-days: 14
