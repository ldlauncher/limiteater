name: Limiteater
options:
  bundleIdPrefix: com.limiteater
  deploymentTarget:
    iOS: "15.0"

settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1"
  ENABLE_BITCODE: NO

targets:
  Limiteater:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Limiteater/App
      - path: Limiteater/Models
      - path: Limiteater/Views
    info:
      path: Limiteater/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.limiteater.app
      PRODUCT_NAME: Limiteater
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual

schemes:
  Limiteater:
    build:
      targets:
        Limiteater: all
